<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompt Form</title>
<meta name="description" content="可変式のプロンプトから入力フォームを作り、コピーできるプロンプトを生成するツール">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='21' font-size='13' font-weight='700' text-anchor='middle' fill='white' font-family='monospace'%3E%7B%7B%7D%7D%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --field: #ffffff;
  --text: #1c2230;
  --muted: #5d6878;
  --border: #dde1e7;
  --accent: #4f46e5;
  --accent-ink: #ffffff;
  --accent-soft: #eef0ff;
  --warn-bg: #fff3d1;
  --warn-soft: #fffaeb;
  --warn-ink: #8a5a00;
  --danger: #c62828;
  --danger-soft: #fdecec;
  --mark-bg: #ffe08a;
  --mark-ink: #4d3800;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .08);
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "BIZ UDGothic", "Osaka-Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a;
    --surface: #1b1e26;
    --surface-2: #232733;
    --field: #161920;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --border: #323745;
    --accent: #8b85ff;
    --accent-ink: #12141a;
    --accent-soft: #262a45;
    --warn-bg: #4a3a12;
    --warn-soft: #2a2414;
    --warn-ink: #f5cf6b;
    --danger: #ff7b7b;
    --danger-soft: #3a1f22;
    --mark-bg: #6b5410;
    --mark-ink: #ffe9a8;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141a;
  --surface: #1b1e26;
  --surface-2: #232733;
  --field: #161920;
  --text: #e6e9ef;
  --muted: #9aa3b2;
  --border: #323745;
  --accent: #8b85ff;
  --accent-ink: #12141a;
  --accent-soft: #262a45;
  --warn-bg: #4a3a12;
  --warn-soft: #2a2414;
  --warn-ink: #f5cf6b;
  --danger: #ff7b7b;
  --danger-soft: #3a1f22;
  --mark-bg: #6b5410;
  --mark-ink: #ffe9a8;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

button {
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 8px;
  padding: 6px 12px;
  line-height: 1.4;
  white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--surface-2); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
button.ghost { background: transparent; border-color: transparent; }
button.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
button.danger:hover:not(:disabled) { background: var(--danger); filter: brightness(1.08); }
button.danger-ghost { background: transparent; border-color: transparent; color: var(--danger); }
button.danger-ghost:hover:not(:disabled) { background: var(--danger-soft); }
button.small { padding: 3px 9px; font-size: 13px; }

input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--field);
  padding: 7px 10px;
  min-height: 38px;
}
textarea { resize: vertical; line-height: 1.55; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }

.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ===== Header ===== */
.app-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.brand-mark {
  display: inline-grid; place-items: center;
  width: 28px; height: 28px; border-radius: 7px;
  background: var(--accent); color: var(--accent-ink);
  font: 700 11px/1 var(--mono);
}
.header-main { flex: 1; min-width: 0; }
#templateSelect { max-width: 380px; }
.header-actions { display: flex; gap: 4px; }
.edit-title { font-weight: 600; }

main { max-width: 1320px; margin: 0 auto; padding: 16px; }

/* ===== Panels ===== */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.panel h2 { font-size: 15px; margin: 0 0 12px; }

/* ===== Use screen ===== */
.use-grid {
  display: grid;
  grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
  grid-template-areas: "form preview" "form copy";
  gap: 12px 16px;
  align-items: start;
}
.form-panel { grid-area: form; }
.preview-panel { grid-area: preview; }
.copy-bar { grid-area: copy; display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
#missingMsg { margin: 0; flex: 1; font-size: 13px; color: var(--muted); text-align: right; }
#missingMsg.warn { color: var(--danger); }
#btnCopy { padding: 10px 28px; font-size: 15px; }

.field { margin-bottom: 14px; }
.field-label { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.req { font-size: 11px; color: var(--danger); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; line-height: 1.5; }
.help { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; white-space: pre-wrap; }
.field.missing input, .field.missing select, .field.missing textarea { border-color: var(--danger); }
.date-row { display: flex; gap: 6px; }
.date-row input { flex: 1; min-width: 0; }
.check-row { display: flex; align-items: center; gap: 8px; min-height: 38px; cursor: pointer; }

.preview-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.preview-head h2 { margin: 0; }
.spacer { flex: 1; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); font-weight: 600; }
.badge-muted { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
#charCount { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.preview {
  font-family: var(--mono);
  font-size: 13.5px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  min-height: 260px;
  max-height: calc(100vh - 250px);
  overflow: auto;
  outline: none;
}
.preview:focus { border-color: var(--accent); }
.preview.locked { border-color: var(--warn-ink); background: var(--warn-soft); }
mark.unfilled { background: var(--mark-bg); color: var(--mark-ink); border-radius: 3px; padding: 0 1px; }
.preview-note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }

.mobile-tabs { display: none; }

.empty {
  max-width: 560px; margin: 48px auto; text-align: center;
}
.empty h2 { font-size: 18px; margin: 0 0 8px; }
.empty p { color: var(--muted); margin: 0 0 20px; }
.empty-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* ===== Edit screen ===== */
.edit-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.edit-bar .title-input { flex: 1; font-size: 16px; font-weight: 600; }
.edit-bar-actions { display: flex; gap: 6px; }
.edit-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.body-editor {
  font-family: var(--mono);
  font-size: 13.5px;
  min-height: calc(100vh - 290px);
  white-space: pre-wrap;
}
.editor-help { font-size: 13px; color: var(--muted); margin: -4px 0 10px; }
.editor-help code, .var-name, .token-list code {
  font-family: var(--mono); font-size: 12.5px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 4px; padding: 0 4px;
}
.warn-box {
  margin-top: 10px; padding: 10px 12px; border-radius: 8px;
  background: var(--warn-bg); color: var(--warn-ink); font-size: 13px;
}
.warn-box ul { margin: 4px 0 0; padding-left: 20px; }
.var-panel-scroll { max-height: calc(100vh - 250px); overflow: auto; margin: 0 -4px; padding: 0 4px; }
.var-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  background: var(--surface);
}
.var-card.unused { background: var(--surface-2); padding: 8px 12px; }
.var-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.var-head .var-name { font-weight: 600; font-size: 13px; }
.var-head-actions { margin-left: auto; display: flex; gap: 2px; }
.var-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 10px; }
.vfield { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.vfield.wide { grid-column: 1 / -1; }
.vlabel { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.vflags { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; }
.vflags label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.sub { font-size: 14px; margin: 18px 0 4px; }
.format-example { font-size: 12.5px; color: var(--muted); }
.token-list { font-size: 12px; color: var(--muted); line-height: 1.9; }

/* ===== Drawer ===== */
#overlay { position: fixed; inset: 0; background: rgba(10, 12, 18, .4); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
  width: min(460px, 100%);
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform .2s ease;
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.drawer-head h2 { font-size: 16px; margin: 0; flex: 1; }
.drawer-body { overflow: auto; padding: 16px; flex: 1; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.item-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item {
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  background: var(--surface);
}
.item.active { border-color: var(--accent); background: var(--accent-soft); }
.item-main {
  display: block; width: 100%; text-align: left; border: 0; background: none; padding: 0;
  white-space: normal;
}
.item-main:hover:not(:disabled) { background: none; }
.item-title { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item-meta { font-size: 12.5px; color: var(--muted); }
.item-actions { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 6px; margin-left: -9px; }
.snippet {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  white-space: pre-wrap; word-break: break-word;
  margin: 6px 0 0; max-height: 4.9em; overflow: hidden;
  border-left: 3px solid var(--border); padding-left: 8px;
}
.settings-section { margin-bottom: 24px; }
.settings-section h3 { font-size: 14px; margin: 0 0 8px; }
.radio-row { display: flex; gap: 16px; flex-wrap: wrap; }
.radio-row label { display: flex; gap: 6px; align-items: center; cursor: pointer; }

/* ===== Dialog ===== */
dialog {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0;
  width: min(460px, calc(100% - 32px));
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
}
dialog::backdrop { background: rgba(10, 12, 18, .45); }
.modal-inner { padding: 20px; }
.modal-title { font-size: 16px; margin: 0 0 10px; }
.modal-body { display: flex; flex-direction: column; gap: 6px; }
.modal-message { margin: 0; white-space: pre-wrap; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.error-text { color: var(--danger); font-size: 13px; margin: 0; min-height: 1.2em; }
.manual-copy { font-family: var(--mono); font-size: 12.5px; min-height: 200px; }

/* ===== Toast ===== */
#toasts {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none; width: max-content; max-width: calc(100% - 32px);
}
.toast {
  background: var(--text); color: var(--bg);
  padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .2);
  transition: opacity .3s, transform .3s;
}
.toast-error { background: var(--danger); color: #fff; }
.toast-warn { background: var(--warn-bg); color: var(--warn-ink); }
.toast.out { opacity: 0; transform: translateY(6px); }

/* ===== Mobile ===== */
@media (max-width: 767px) {
  main { padding: 12px 12px calc(92px + env(safe-area-inset-bottom)); }
  .app-header { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
  .header-main { order: 3; flex-basis: 100%; }
  #templateSelect { max-width: none; }
  .header-actions { margin-left: auto; }
  .header-actions button { padding: 5px 9px; }
  .mobile-tabs {
    display: flex; gap: 4px; margin-bottom: 12px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 4px;
  }
  .mobile-tabs button { flex: 1; border: 0; background: transparent; }
  .mobile-tabs button[aria-selected="true"] { background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
  .use-grid { display: block; }
  .use-grid.tab-form .preview-panel { display: none; }
  .use-grid.tab-preview .form-panel { display: none; }
  .copy-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  #missingMsg { text-align: left; }
  .preview { max-height: none; min-height: 55vh; }
  #toasts { bottom: calc(84px + env(safe-area-inset-bottom)); }
  .edit-bar { flex-wrap: wrap; }
  .edit-bar .title-input { order: 3; flex-basis: 100%; }
  .edit-bar-actions { margin-left: auto; }
  .edit-grid { display: block; }
  .edit-grid > .panel + .panel { margin-top: 12px; }
  .body-editor { min-height: 50vh; }
  .var-panel-scroll { max-height: none; overflow: visible; }
  .var-grid { grid-template-columns: 1fr; }
  main.editing { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<header class="app-header">
  <div class="brand"><span class="brand-mark" aria-hidden="true">{{}}</span><span>Prompt Form</span></div>
  <div class="header-main" id="headerMain">
    <select id="templateSelect" aria-label="テンプレートを選択"></select>
  </div>
  <div class="header-main edit-title" id="headerEdit" hidden>テンプレートを編集</div>
  <nav class="header-actions" id="headerActions" aria-label="メニュー">
    <button type="button" id="btnList">一覧</button>
    <button type="button" id="btnHistory">履歴</button>
    <button type="button" id="btnEdit">編集</button>
    <button type="button" id="btnSettings">設定</button>
  </nav>
</header>

<main id="main">
  <section id="useScreen">
    <div id="emptyState" class="empty" hidden>
      <h2>テンプレートがまだありません</h2>
      <p>プロンプトの中で入力欄にしたい箇所を <code>{{変数名}}</code> と書くと、入力フォームが自動で作られます。</p>
      <div class="empty-actions">
        <button type="button" class="primary" id="emptyNew">新規作成</button>
        <button type="button" id="emptySample">サンプル（X日記）を追加</button>
        <button type="button" id="emptyImport">バックアップを読み込む</button>
      </div>
    </div>

    <div class="mobile-tabs" id="mobileTabs" role="tablist">
      <button type="button" role="tab" data-tab="form">入力</button>
      <button type="button" role="tab" data-tab="preview">プレビュー</button>
    </div>

    <div class="use-grid tab-form" id="useGrid">
      <section class="panel form-panel" aria-labelledby="formTitle">
        <h2 id="formTitle">入力</h2>
        <form id="form" autocomplete="off" novalidate></form>
      </section>
      <section class="panel preview-panel" aria-labelledby="previewTitle">
        <div class="preview-head">
          <h2 id="previewTitle">プレビュー</h2>
          <span class="badge" id="lockBadge" hidden>編集中</span>
          <span class="spacer"></span>
          <span id="charCount"></span>
          <button type="button" class="small" id="btnReset" hidden>リセット</button>
        </div>
        <div id="preview" class="preview" spellcheck="false" role="textbox" aria-multiline="true" aria-label="生成されたプロンプト"></div>
        <p class="preview-note" id="previewNote">プレビューは直接手直しできます。手直しすると、フォームの変更は反映されなくなります。</p>
      </section>
      <div class="copy-bar">
        <p id="missingMsg" aria-live="polite"></p>
        <button type="button" class="primary" id="btnCopy">コピー</button>
      </div>
    </div>
  </section>

  <section id="editScreen" hidden></section>
</main>

<div id="overlay" hidden></div>
<aside id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <h2 id="drawerTitle"></h2>
    <button type="button" class="ghost" id="drawerClose">閉じる</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<dialog id="modal"></dialog>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="fileInput" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* =========================================================
 * 定数
 * ======================================================= */
const KEYS = {
  templates: 'pf.templates',
  history: 'pf.history',
  lastValues: 'pf.lastValues',
  settings: 'pf.settings',
};
const HISTORY_LIMIT = 50;
const FORMAT_ID = 'prompt-form';
const FORMAT_VERSION = 1;
const QUOTA_WARN_BYTES = 4.5 * 1024 * 1024;
const NAME_RE = /^[\p{L}\p{N}_]+$/u;
const TOKEN_SOURCE = String.raw`\\\{\{|\{\{([^{}\n]*?)\}\}`;
const DEFAULT_DATE_FORMAT = 'YYYY年MM月DD日';
const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
const TYPES = [
  ['text', '1行テキスト'],
  ['textarea', '複数行テキスト'],
  ['date', '日付'],
  ['select', '選択肢'],
  ['number', '数値'],
  ['checkbox', 'チェックボックス'],
];
const TYPE_KEYS = TYPES.map(t => t[0]);

/* =========================================================
 * 汎用ヘルパー
 * ======================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const hasOwn = (obj, key) => obj != null && Object.prototype.hasOwnProperty.call(obj, key);
const clone = obj => JSON.parse(JSON.stringify(obj));
const str = v => (v == null ? '' : String(v));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const byOrder = (a, b) => (a.order || 0) - (b.order || 0);

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  let value;
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'value') { value = v; continue; }
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'readOnly') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  if (value !== undefined) el.value = value;
  return el;
}

function pad2(n) { return String(n).padStart(2, '0'); }

function isoDate(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function formatDate(iso, fmt) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return '';
  const [, y, mo, d] = m;
  const wd = WEEKDAYS[new Date(Number(y), Number(mo) - 1, Number(d)).getDay()];
  const map = { YYYY: y, MM: mo, M: String(Number(mo)), DD: d, D: String(Number(d)), ddd: wd };
  return (fmt || DEFAULT_DATE_FORMAT).replace(/YYYY|MM|M|DD|D|ddd/g, t => map[t]);
}

function formatDateTime(isoString) {
  const d = new Date(isoString);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function compactDate() {
  const d = new Date();
  return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
}

function countChars(s) { return [...s].length; }

/* =========================================================
 * 保存（localStorage）
 * ======================================================= */
function load(key, fallback) {
  try {
    const s = localStorage.getItem(key);
    return s ? JSON.parse(s) : fallback;
  } catch (e) {
    return fallback;
  }
}

function persist(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    checkQuota();
    return true;
  } catch (e) {
    toast('保存できませんでした。容量が不足している可能性があります。設定から書き出してください。', 'error', 5000);
    return false;
  }
}

function storageBytes() {
  let total = 0;
  try {
    for (const k of Object.values(KEYS)) {
      const v = localStorage.getItem(k);
      if (v) total += (k.length + v.length) * 2;
    }
  } catch (e) { /* ignore */ }
  return total;
}

function checkQuota() {
  if (state.quotaWarned) return;
  if (storageBytes() > QUOTA_WARN_BYTES) {
    state.quotaWarned = true;
    toast('保存データが上限に近づいています。設定からバックアップを書き出してください。', 'warn', 6000);
  }
}

const saveTemplates = () => persist(KEYS.templates, state.templates);
const saveHistory = () => persist(KEYS.history, state.history);
const saveLastValues = () => persist(KEYS.lastValues, state.lastValues);
const saveSettings = () => persist(KEYS.settings, state.settings);

/* =========================================================
 * テンプレートの解析と生成
 * ======================================================= */
function parseBody(body) {
  const segs = [];
  const invalid = [];
  const re = new RegExp(TOKEN_SOURCE, 'g');
  let last = 0;
  let m;
  while ((m = re.exec(body))) {
    if (m.index > last) segs.push({ t: 'text', v: body.slice(last, m.index) });
    if (m[0] === '\\{{') {
      segs.push({ t: 'text', v: '{{' });
    } else if (NAME_RE.test(m[1])) {
      segs.push({ t: 'var', name: m[1] });
    } else {
      segs.push({ t: 'text', v: m[0] });
      invalid.push(m[0]);
    }
    last = re.lastIndex;
  }
  if (last < body.length) segs.push({ t: 'text', v: body.slice(last) });
  const names = [...new Set(segs.filter(s => s.t === 'var').map(s => s.name))];
  return { segs, invalid: [...new Set(invalid)], names };
}

function newVar(name, order) {
  return {
    name, label: '', type: 'text', required: false, default: '',
    placeholder: '', help: '', keepLast: false, order, unused: false, options: {},
  };
}

function isPristine(v) {
  return !v.label && v.type === 'text' && !v.required && !v.default &&
    !v.placeholder && !v.help && !v.keepLast;
}

/** 本文と変数設定を連動させる（F-11〜F-13） */
function syncVariables(t) {
  const { names } = parseBody(t.body);
  const used = new Set(names);
  let maxOrder = t.variables.reduce((m, v) => Math.max(m, v.order || 0), 0);
  for (const n of names) {
    if (!t.variables.some(v => v.name === n)) {
      const v = newVar(n, ++maxOrder);
      v._auto = true;
      t.variables.push(v);
    }
  }
  // 編集中に自動で追加され、まだ何も設定していない変数は、本文から消えたら取り除く（打ちかけの名前が残らないように）
  t.variables = t.variables.filter(v => used.has(v.name) || !(v._auto && isPristine(v)));
  for (const v of t.variables) v.unused = !used.has(v.name);
  return t;
}

function varText(v, raw) {
  switch (v.type) {
    case 'date': return formatDate(raw, v.options && v.options.format);
    case 'checkbox': return raw ? str(v.options && v.options.onText) : str(v.options && v.options.offText);
    default: return str(raw);
  }
}

function isFilled(v, raw) {
  if (v.type === 'checkbox') return true;
  return varText(v, raw).trim() !== '';
}

function generate(t, values) {
  const vmap = Object.fromEntries(t.variables.map(v => [v.name, v]));
  return parseBody(t.body).segs.map(s => {
    if (s.t === 'text') return s;
    const v = vmap[s.name] || newVar(s.name, 0);
    const raw = values[s.name];
    const filled = isFilled(v, raw);
    return { t: 'var', name: s.name, v: filled ? varText(v, raw) : `{{${s.name}}}`, filled };
  });
}

const segsToText = segs => segs.map(s => s.v).join('');

function coerceValue(v, raw) {
  if (v.type === 'checkbox') return raw === true || raw === 'true';
  return str(raw);
}

function initialValue(v, last) {
  if (v.keepLast && hasOwn(last, v.name)) return coerceValue(v, last[v.name]);
  const d = v.default;
  switch (v.type) {
    case 'date':
      if (d === 'today') return isoDate(0);
      if (d === 'yesterday') return isoDate(-1);
      return /^\d{4}-\d{2}-\d{2}$/.test(str(d)) ? d : '';
    case 'checkbox':
      return d === true || d === 'true';
    default:
      return str(d);
  }
}

/* =========================================================
 * 正規化（読み込み時）
 * ======================================================= */
function normalizeVar(v) {
  const type = TYPE_KEYS.includes(v.type) ? v.type : 'text';
  return {
    name: v.name,
    label: str(v.label),
    type,
    required: !!v.required,
    default: type === 'checkbox' ? (v.default === true || v.default === 'true') : str(v.default),
    placeholder: str(v.placeholder),
    help: str(v.help),
    keepLast: !!v.keepLast,
    order: Number.isFinite(v.order) ? v.order : 0,
    unused: !!v.unused,
    options: v.options && typeof v.options === 'object' && !Array.isArray(v.options) ? { ...v.options } : {},
  };
}

function normalizeTemplate(raw, newId = false) {
  if (!raw || typeof raw !== 'object' || typeof raw.body !== 'string') return null;
  const now = new Date().toISOString();
  const seen = new Set();
  const vars = (Array.isArray(raw.variables) ? raw.variables : [])
    .filter(v => v && typeof v.name === 'string' && NAME_RE.test(v.name))
    .filter(v => (seen.has(v.name) ? false : (seen.add(v.name), true)))
    .map(normalizeVar);
  const t = {
    id: !newId && typeof raw.id === 'string' && raw.id ? raw.id : uuid(),
    name: typeof raw.name === 'string' && raw.name.trim() ? raw.name : '無題のテンプレート',
    body: raw.body,
    variables: vars,
    createdAt: typeof raw.createdAt === 'string' ? raw.createdAt : now,
    updatedAt: typeof raw.updatedAt === 'string' ? raw.updatedAt : now,
  };
  syncVariables(t);
  t.variables.forEach(v => delete v._auto);
  return t;
}

function normalizeHistoryItem(raw) {
  if (!raw || typeof raw !== 'object' || typeof raw.output !== 'string') return null;
  return {
    id: typeof raw.id === 'string' ? raw.id : uuid(),
    templateId: str(raw.templateId),
    templateName: str(raw.templateName) || '（名前なし）',
    values: raw.values && typeof raw.values === 'object' ? raw.values : {},
    output: raw.output,
    edited: !!raw.edited,
    copiedAt: typeof raw.copiedAt === 'string' ? raw.copiedAt : new Date().toISOString(),
  };
}

/* =========================================================
 * 状態
 * ======================================================= */
const state = {
  templates: [],
  history: [],
  lastValues: {},
  settings: { theme: 'auto', lastTemplateId: null },
  currentId: null,
  values: {},
  locked: false,
  lockedText: '',
  mobileTab: 'form',
  screen: 'use',
  draft: null,
  draftDirty: false,
  quotaWarned: false,
};

function loadState() {
  const tpl = load(KEYS.templates, []);
  state.templates = (Array.isArray(tpl) ? tpl : []).map(t => normalizeTemplate(t)).filter(Boolean);
  const hist = load(KEYS.history, []);
  state.history = (Array.isArray(hist) ? hist : []).map(normalizeHistoryItem).filter(Boolean).slice(0, HISTORY_LIMIT);
  const lv = load(KEYS.lastValues, {});
  state.lastValues = lv && typeof lv === 'object' && !Array.isArray(lv) ? lv : {};
  const st = load(KEYS.settings, {});
  state.settings = Object.assign({ theme: 'auto', lastTemplateId: null }, st && typeof st === 'object' ? st : {});
}

const current = () => state.templates.find(t => t.id === state.currentId) || null;
const sortedTemplates = () => [...state.templates].sort((a, b) => str(b.updatedAt).localeCompare(str(a.updatedAt)));

function uniqueName(name, exceptId) {
  const names = new Set(state.templates.filter(t => t.id !== exceptId).map(t => t.name));
  if (!names.has(name)) return name;
  let i = 2;
  while (names.has(`${name} (${i})`)) i++;
  return `${name} (${i})`;
}

/* =========================================================
 * トースト・ダイアログ・ドロワー
 * ======================================================= */
function toast(msg, kind = 'ok', ms = 2200) {
  const el = h('div', { class: `toast toast-${kind}`, role: 'status', text: msg });
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), ms);
  setTimeout(() => el.remove(), ms + 400);
}

function modal({ title, content, actions, onOpen }) {
  return new Promise(resolve => {
    const dlg = $('#modal');
    if (dlg.open) dlg.close();
    let result = null;
    const footer = h('div', { class: 'modal-actions' },
      actions.map(a => h('button', {
        type: 'button',
        class: a.class || '',
        onclick: () => {
          if (a.validate && !a.validate()) return;
          result = a.value;
          dlg.close();
        },
      }, a.label)));
    dlg.replaceChildren(h('div', { class: 'modal-inner' },
      h('h2', { class: 'modal-title', text: title }), content || null, footer));
    const onClose = () => {
      dlg.removeEventListener('close', onClose);
      resolve(result);
    };
    dlg.addEventListener('close', onClose);
    dlg.showModal();
    if (onOpen) onOpen(dlg, footer);
  });
}

async function confirmDialog(message, { title = '確認', ok = 'OK', danger = false } = {}) {
  const r = await modal({
    title,
    content: h('p', { class: 'modal-message', text: message }),
    actions: [
      { label: 'キャンセル', value: null, class: 'ghost' },
      { label: ok, value: true, class: danger ? 'danger' : 'primary' },
    ],
  });
  return r === true;
}

async function promptDialog(title, label, initial, validate, okLabel = '決定') {
  const input = h('input', { type: 'text', value: initial });
  const err = h('p', { class: 'error-text' });
  const check = () => {
    const msg = validate(input.value);
    err.textContent = msg;
    return !msg;
  };
  const r = await modal({
    title,
    content: h('div', { class: 'modal-body' }, h('span', { class: 'vlabel', text: label }), input, err),
    actions: [
      { label: 'キャンセル', value: null, class: 'ghost' },
      { label: okLabel, value: 'ok', class: 'primary', validate: check },
    ],
    onOpen: (dlg, footer) => {
      input.focus();
      input.select();
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          footer.lastChild.click();
        }
      });
    },
  });
  return r === 'ok' ? input.value : null;
}

let drawerRender = null;
function openDrawer(title, render) {
  drawerRender = render;
  $('#drawerTitle').textContent = title;
  refreshDrawer();
  const d = $('#drawer');
  d.hidden = false;
  $('#overlay').hidden = false;
  requestAnimationFrame(() => d.classList.add('open'));
  $('#drawerClose').focus();
}
function refreshDrawer() {
  if (!drawerRender) return;
  const body = $('#drawerBody');
  const scroll = body.scrollTop;
  body.replaceChildren();
  drawerRender(body);
  body.scrollTop = scroll;
}
function closeDrawer() {
  const d = $('#drawer');
  d.classList.remove('open');
  $('#overlay').hidden = true;
  drawerRender = null;
  setTimeout(() => { if (!drawerRender) d.hidden = true; }, 220);
}
const drawerOpen = () => !$('#drawer').hidden && drawerRender != null;

/* =========================================================
 * テーマ
 * ======================================================= */
function applyTheme() {
  const t = state.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}

/* =========================================================
 * 利用画面
 * ======================================================= */
function openTemplate(id, values) {
  const t = state.templates.find(x => x.id === id);
  if (!t) return;
  state.currentId = id;
  state.settings.lastTemplateId = id;
  saveSettings();
  state.locked = false;
  state.lockedText = '';
  const last = state.lastValues[id];
  state.values = {};
  for (const v of t.variables) {
    state.values[v.name] = values && hasOwn(values, v.name)
      ? coerceValue(v, values[v.name])
      : initialValue(v, last);
  }
  renderUse();
}

function renderUse() {
  const has = state.templates.length > 0;
  if (has && !current()) {
    openTemplate(sortedTemplates()[0].id);
    return;
  }
  $('#emptyState').hidden = has;
  $('#useGrid').hidden = !has;
  $('#mobileTabs').hidden = !has;
  $('#headerMain').hidden = !has;
  $('#btnEdit').disabled = !has;
  renderTemplateSelect();
  if (has) {
    renderForm();
    renderPreview();
  }
  applyMobileTab();
}

function renderTemplateSelect() {
  const sel = $('#templateSelect');
  sel.replaceChildren(...sortedTemplates().map(t => h('option', { value: t.id, text: t.name })));
  if (state.currentId) sel.value = state.currentId;
}

function applyMobileTab() {
  const g = $('#useGrid');
  g.classList.toggle('tab-form', state.mobileTab === 'form');
  g.classList.toggle('tab-preview', state.mobileTab === 'preview');
  for (const b of document.querySelectorAll('#mobileTabs [data-tab]')) {
    b.setAttribute('aria-selected', String(b.dataset.tab === state.mobileTab));
  }
}

function renderForm() {
  const t = current();
  const form = $('#form');
  form.replaceChildren();
  const vars = t.variables.filter(v => !v.unused).sort(byOrder);
  if (!vars.length) {
    form.append(h('p', { class: 'muted small', text: 'このテンプレートには入力欄がありません。編集画面で本文に {{変数名}} を書くと、入力欄が追加されます。' }));
    return;
  }
  vars.forEach((v, i) => form.append(fieldFor(v, `f${i}`)));
}

function fieldFor(v, id) {
  const label = v.label || v.name;
  const val = state.values[v.name];
  const set = x => {
    state.values[v.name] = x;
    renderPreview();
  };
  const ph = v.placeholder || null;
  let control;
  switch (v.type) {
    case 'textarea':
      control = h('textarea', { id, rows: 3, placeholder: ph, value: str(val), oninput: e => set(e.target.value) });
      break;
    case 'number': {
      const o = v.options || {};
      control = h('input', {
        type: 'number', id, placeholder: ph, value: str(val), inputmode: 'decimal', step: 'any',
        min: str(o.min) !== '' ? o.min : null, max: str(o.max) !== '' ? o.max : null,
        oninput: e => set(e.target.value),
      });
      break;
    }
    case 'date': {
      const input = h('input', { type: 'date', id, value: str(val), oninput: e => set(e.target.value), onchange: e => set(e.target.value) });
      const quick = (labelText, offset) => h('button', {
        type: 'button', class: 'small',
        onclick: () => { input.value = isoDate(offset); set(input.value); },
      }, labelText);
      control = h('div', { class: 'date-row' }, input, quick('昨日', -1), quick('今日', 0));
      break;
    }
    case 'select': {
      const choices = (v.options && Array.isArray(v.options.choices)) ? v.options.choices : [];
      const opts = [h('option', { value: '', text: '選択してください' }), ...choices.map(c => h('option', { value: c, text: c }))];
      control = h('select', { id, value: str(val), onchange: e => set(e.target.value) }, opts);
      break;
    }
    case 'checkbox':
      control = h('label', { class: 'check-row' },
        h('input', { type: 'checkbox', id, checked: !!val, onchange: e => set(e.target.checked) }),
        h('span', { text: label }));
      break;
    default:
      control = h('input', { type: 'text', id, placeholder: ph, value: str(val), oninput: e => set(e.target.value) });
  }
  const showReq = v.required && v.type !== 'checkbox';
  return h('div', { class: 'field', 'data-var': v.name },
    v.type === 'checkbox'
      ? h('div', { class: 'field-label', text: label })
      : h('label', { class: 'field-label', for: id }, label, showReq ? h('span', { class: 'req', text: '必須' }) : null),
    control,
    v.help ? h('p', { class: 'help', text: v.help }) : null);
}

function requiredMissing() {
  const t = current();
  if (!t) return [];
  return t.variables
    .filter(v => !v.unused && v.required && v.type !== 'checkbox')
    .filter(v => !isFilled(v, state.values[v.name]))
    .sort(byOrder);
}

function currentOutput() {
  const t = current();
  if (!t) return '';
  return state.locked ? state.lockedText : segsToText(generate(t, state.values));
}

function renderPreview() {
  const t = current();
  if (!t) return;
  const out = $('#preview');
  if (!state.locked) {
    const segs = generate(t, state.values);
    out.replaceChildren(...segs.map(s => (s.t === 'var' && !s.filled
      ? h('mark', { class: 'unfilled', text: s.v })
      : document.createTextNode(s.v))));
  }
  updateMeta();
}

function updateMeta() {
  const text = currentOutput();
  $('#charCount').textContent = `${countChars(text).toLocaleString()}文字`;
  $('#lockBadge').hidden = !state.locked;
  $('#btnReset').hidden = !state.locked;
  $('#preview').classList.toggle('locked', state.locked);
  $('#previewNote').textContent = state.locked
    ? '手直し中のため、フォームの変更は反映されません。「リセット」でフォームの内容に戻します。'
    : 'プレビューは直接手直しできます。手直しすると、フォームの変更は反映されなくなります。';

  const missing = state.locked ? [] : requiredMissing();
  const names = new Set(missing.map(v => v.name));
  for (const f of document.querySelectorAll('#form .field')) {
    f.classList.toggle('missing', names.has(f.dataset.var));
  }
  const btn = $('#btnCopy');
  const msg = $('#missingMsg');
  btn.disabled = !current() || missing.length > 0;
  msg.classList.toggle('warn', missing.length > 0);
  msg.textContent = missing.length
    ? `未入力の必須項目：${missing.map(v => v.label || v.name).join('、')}`
    : (state.locked ? '手直しした内容をコピーします' : '');
}

async function resetLock() {
  const ok = await confirmDialog('手直しした内容を破棄して、フォームの内容から作り直します。', { ok: 'リセット', danger: true });
  if (!ok) return;
  state.locked = false;
  state.lockedText = '';
  renderPreview();
}

/* ----- コピー（F-37）と履歴（F-41〜F-42） ----- */
async function writeClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* フォールバックへ */ }
  try {
    const ta = h('textarea', { value: text, readonly: true, style: 'position:fixed;top:-1000px;left:0;opacity:0' });
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) {
    return false;
  }
}

function showManualCopy(text) {
  const ta = h('textarea', { class: 'manual-copy', value: text, readonly: true });
  modal({
    title: '手動でコピーしてください',
    content: h('div', { class: 'modal-body' },
      h('p', { class: 'modal-message', text: 'この環境では自動でコピーできませんでした。下の文章を選択してコピーしてください。' }), ta),
    actions: [{ label: '閉じる', value: null, class: 'primary' }],
    onOpen: () => { ta.focus(); ta.select(); },
  });
}

async function doCopy() {
  const t = current();
  if (!t || $('#btnCopy').disabled) return;
  const text = currentOutput();
  const ok = await writeClipboard(text);
  recordHistory(t, text);
  state.lastValues[t.id] = clone(state.values);
  saveLastValues();
  if (ok) toast('コピーしました');
  else showManualCopy(text);
}

function recordHistory(t, text) {
  state.history.unshift({
    id: uuid(),
    templateId: t.id,
    templateName: t.name,
    values: clone(state.values),
    output: text,
    edited: state.locked,
    copiedAt: new Date().toISOString(),
  });
  if (state.history.length > HISTORY_LIMIT) state.history.length = HISTORY_LIMIT;
  saveHistory();
  if (drawerOpen()) refreshDrawer();
}

async function switchTemplate(id) {
  if (id === state.currentId) return true;
  if (state.locked) {
    const ok = await confirmDialog('手直ししたプレビューの内容は破棄されます。テンプレートを切り替えますか？', { ok: '切り替える' });
    if (!ok) {
      renderTemplateSelect();
      return false;
    }
  }
  openTemplate(id);
  return true;
}

/* =========================================================
 * テンプレート一覧（F-01〜F-06, F-53〜F-54）
 * ======================================================= */
function renderListDrawer(body) {
  body.append(h('div', { class: 'toolbar' },
    h('button', { type: 'button', class: 'primary', onclick: () => { closeDrawer(); openEditor(null); } }, '新規作成'),
    h('button', { type: 'button', onclick: importFromFile }, '読み込み（JSON）'),
    h('button', { type: 'button', onclick: addSample }, 'サンプルを追加')));

  const list = sortedTemplates();
  if (!list.length) {
    body.append(h('p', { class: 'muted', text: 'テンプレートはまだありません。' }));
    return;
  }
  body.append(h('ul', { class: 'item-list' }, list.map(t => {
    const usedCount = t.variables.filter(v => !v.unused).length;
    return h('li', { class: 'item' + (t.id === state.currentId ? ' active' : '') },
      h('button', {
        type: 'button', class: 'item-main',
        onclick: async () => { if (await switchTemplate(t.id)) closeDrawer(); },
      },
        h('div', { class: 'item-title' }, t.name, t.id === state.currentId ? h('span', { class: 'badge badge-muted', text: '使用中' }) : null),
        h('div', { class: 'item-meta', text: `入力欄 ${usedCount}個 ・ 更新 ${formatDateTime(t.updatedAt)}` })),
      h('div', { class: 'item-actions' },
        h('button', { type: 'button', class: 'small ghost', onclick: () => { closeDrawer(); openEditor(t.id); } }, '編集'),
        h('button', { type: 'button', class: 'small ghost', onclick: () => duplicateTemplate(t.id) }, '複製'),
        h('button', { type: 'button', class: 'small ghost', onclick: () => exportTemplate(t.id) }, '書き出し'),
        h('button', { type: 'button', class: 'small danger-ghost', onclick: () => deleteTemplate(t.id) }, '削除')));
  })));
}

function duplicateTemplate(id) {
  const src = state.templates.find(t => t.id === id);
  if (!src) return;
  const now = new Date().toISOString();
  const t = clone(src);
  t.id = uuid();
  t.name = uniqueName(`${src.name} のコピー`);
  t.createdAt = now;
  t.updatedAt = now;
  state.templates.push(t);
  saveTemplates();
  renderTemplateSelect();
  refreshDrawer();
  toast('複製しました');
}

async function deleteTemplate(id) {
  const t = state.templates.find(x => x.id === id);
  if (!t) return false;
  const ok = await confirmDialog(`「${t.name}」を削除します。元に戻せません。\nコピー履歴は残ります。`, { ok: '削除', danger: true });
  if (!ok) return false;
  state.templates = state.templates.filter(x => x.id !== id);
  delete state.lastValues[id];
  saveTemplates();
  saveLastValues();
  if (state.currentId === id) {
    state.currentId = null;
    state.locked = false;
  }
  renderUse();
  refreshDrawer();
  toast('削除しました');
  return true;
}

/* =========================================================
 * コピー履歴（F-43〜F-45）
 * ======================================================= */
function renderHistoryDrawer(body) {
  if (!state.history.length) {
    body.append(h('p', { class: 'muted', text: 'コピー履歴はまだありません。コピーすると、ここに直近50件まで残ります。' }));
    return;
  }
  body.append(h('div', { class: 'toolbar' },
    h('span', { class: 'muted small', style: 'align-self:center;flex:1', text: `${state.history.length} / ${HISTORY_LIMIT}件` }),
    h('button', {
      type: 'button', class: 'small danger-ghost',
      onclick: async () => {
        if (!await confirmDialog('コピー履歴をすべて削除します。元に戻せません。', { ok: 'すべて削除', danger: true })) return;
        state.history = [];
        saveHistory();
        refreshDrawer();
      },
    }, 'すべて削除')));

  body.append(h('ul', { class: 'item-list' }, state.history.map(item => {
    const exists = state.templates.some(t => t.id === item.templateId);
    return h('li', { class: 'item' },
      h('div', { class: 'item-title' }, item.templateName, item.edited ? h('span', { class: 'badge', text: '手直しあり' }) : null),
      h('div', { class: 'item-meta', text: `${formatDateTime(item.copiedAt)} ・ ${countChars(item.output).toLocaleString()}文字` }),
      h('pre', { class: 'snippet', text: item.output.split('\n').filter(l => l.trim()).slice(0, 3).join('\n') }),
      h('div', { class: 'item-actions' },
        h('button', {
          type: 'button', class: 'small ghost',
          onclick: async () => {
            if (await writeClipboard(item.output)) toast('コピーしました');
            else showManualCopy(item.output);
          },
        }, '再コピー'),
        h('button', {
          type: 'button', class: 'small ghost', disabled: !exists,
          title: exists ? null : 'テンプレートが削除されているため復元できません',
          onclick: () => restoreValues(item),
        }, '入力値を復元'),
        h('button', {
          type: 'button', class: 'small danger-ghost',
          onclick: () => {
            state.history = state.history.filter(x => x.id !== item.id);
            saveHistory();
            refreshDrawer();
          },
        }, '削除')));
  })));
}

async function restoreValues(item) {
  if (state.locked && item.templateId === state.currentId) {
    const ok = await confirmDialog('手直ししたプレビューの内容は破棄されます。入力値を復元しますか？', { ok: '復元' });
    if (!ok) return;
  }
  openTemplate(item.templateId, item.values);
  state.mobileTab = 'form';
  applyMobileTab();
  closeDrawer();
  toast('入力値を復元しました');
}

/* =========================================================
 * 設定・バックアップ（F-51〜F-55）
 * ======================================================= */
function renderSettingsDrawer(body) {
  const themeOpt = (value, label) => h('label', {},
    h('input', {
      type: 'radio', name: 'theme', value, checked: state.settings.theme === value,
      onchange: () => { state.settings.theme = value; saveSettings(); applyTheme(); },
    }), label);

  body.append(
    h('section', { class: 'settings-section' },
      h('h3', { text: 'テーマ' }),
      h('div', { class: 'radio-row' }, themeOpt('auto', '自動（OSに合わせる）'), themeOpt('light', 'ライト'), themeOpt('dark', 'ダーク'))),
    h('section', { class: 'settings-section' },
      h('h3', { text: 'バックアップ' }),

    h('section', { class: 'settings-section' },
      h('h3', { text: 'ショートカット' }),

function download(filename, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: filename });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

const safeFileName = s => s.replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 80) || 'template';

function exportAll() {
  download(`prompt-form-backup-${compactDate()}.json`, {
    format: FORMAT_ID,
    version: FORMAT_VERSION,
    kind: 'backup',
    exportedAt: new Date().toISOString(),
    templates: state.templates,
    history: state.history,
  });
  toast('書き出しました');
}

function exportTemplate(id) {
  const t = state.templates.find(x => x.id === id);
  if (!t) return;
  download(`template-${safeFileName(t.name)}.json`, {
    format: FORMAT_ID,
    version: FORMAT_VERSION,
    kind: 'template',
    exportedAt: new Date().toISOString(),
    template: t,
  });
  toast('書き出しました');
}

function pickFile() {
  return new Promise(resolve => {
    const input = $('#fileInput');
    input.value = '';
    input.onchange = () => {
      const f = input.files && input.files[0];
      if (!f) { resolve(null); return; }
      f.text().then(resolve, () => resolve(null));
    };
    input.click();
  });
}

function addTemplates(list) {
  for (const t of list) {
    t.name = uniqueName(t.name);
    state.templates.push(t);
  }
  saveTemplates();
}

async function importFromFile() {
  const text = await pickFile();
  if (text == null) return;
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    toast('JSONとして読み込めませんでした', 'error', 4000);
    return;
  }
  if (!data || data.format !== FORMAT_ID) {
    toast('このツールで書き出したファイルではありません', 'error', 4000);
    return;
  }
  if (data.version !== FORMAT_VERSION) {
    toast(`対応していない形式のバージョンです（${str(data.version)}）`, 'error', 4000);
    return;
  }

  if (data.kind === 'template') {
    const t = normalizeTemplate(data.template, true);
    if (!t) {
      toast('テンプレートの内容が正しくありません', 'error', 4000);
      return;
    }
    addTemplates([t]);
    toast(`「${t.name}」を追加しました`);
    if (!state.currentId) openTemplate(t.id); else renderUse();
    refreshDrawer();
    return;
  }

  if (data.kind !== 'backup' || !Array.isArray(data.templates)) {
    toast('ファイルの内容が正しくありません', 'error', 4000);
    return;
  }

  const idMap = {};
  const templates = [];
  for (const raw of data.templates) {
    const t = normalizeTemplate(raw, true);
    if (!t) continue;
    if (raw && typeof raw.id === 'string') idMap[raw.id] = t.id;
    templates.push(t);
  }
  const history = (Array.isArray(data.history) ? data.history : [])
    .map(normalizeHistoryItem).filter(Boolean)
    .map(x => ({ ...x, id: uuid(), templateId: idMap[x.templateId] || x.templateId }));

  const mode = await modal({
    title: 'バックアップの読み込み',
    content: h('p', { class: 'modal-message', text: `テンプレート ${templates.length}件、コピー履歴 ${history.length}件を読み込みます。\n\n追加：今のデータを残したまま加えます。\n全置換：今のデータをすべて削除し、ファイルの内容に置き換えます。` }),
    actions: [
      { label: 'キャンセル', value: null, class: 'ghost' },
      { label: '全置換', value: 'replace', class: 'danger-ghost' },
      { label: '追加', value: 'add', class: 'primary' },
    ],
  });
  if (!mode) return;

  if (mode === 'replace') {
    const ok = await confirmDialog('今のテンプレートとコピー履歴はすべて削除され、元に戻せません。続けますか？', { ok: '全置換する', danger: true });
    if (!ok) return;
    state.templates = templates;
    state.history = history.sort((a, b) => b.copiedAt.localeCompare(a.copiedAt)).slice(0, HISTORY_LIMIT);
    state.lastValues = {};
    state.currentId = null;
    saveTemplates();
    saveLastValues();
  } else {
    addTemplates(templates);
    state.history = [...state.history, ...history]
      .sort((a, b) => b.copiedAt.localeCompare(a.copiedAt))
      .slice(0, HISTORY_LIMIT);
  }
  saveHistory();
  state.locked = false;
  renderUse();
  refreshDrawer();
  toast(mode === 'replace' ? '置き換えました' : '追加しました');
}

/* =========================================================
 * 編集画面（F-02〜F-03, F-11〜F-15, 3.4）
 * ======================================================= */
function showScreen(name) {
  state.screen = name;
  $('#useScreen').hidden = name !== 'use';
  $('#editScreen').hidden = name !== 'edit';
  $('#headerEdit').hidden = name !== 'edit';
  $('#headerActions').hidden = name === 'edit';
  $('#main').classList.toggle('editing', name === 'edit');
  if (name === 'edit') $('#headerMain').hidden = true;
  window.scrollTo(0, 0);
}

function openEditor(id) {
  const base = id ? state.templates.find(t => t.id === id) : null;
  state.draft = base ? clone(base) : { id: null, name: '', body: '', variables: [] };
  state.draft._renames = {};
  state.draftDirty = false;
  showScreen('edit');
  renderEditor();
  if (!base) $('.title-input').focus();
}

const markDirty = () => { state.draftDirty = true; };
const varSignature = d => d.variables.map(v => `${v.name}:${v.unused}`).join('|');

function renderEditor() {
  const d = state.draft;
  const root = $('#editScreen');
  root.replaceChildren();

  const nameInput = h('input', {
    type: 'text', class: 'title-input', placeholder: 'テンプレート名', 'aria-label': 'テンプレート名',
    value: d.name, oninput: e => { d.name = e.target.value; markDirty(); },
  });
  const bar = h('div', { class: 'edit-bar' },
    h('button', { type: 'button', class: 'ghost', onclick: cancelEdit }, '← 戻る'),
    nameInput,
    h('div', { class: 'edit-bar-actions' },
      d.id ? h('button', { type: 'button', class: 'danger-ghost', onclick: deleteFromEditor }, '削除') : null,
      h('button', { type: 'button', class: 'primary', onclick: saveDraft }, '保存')));

  const bodyInput = h('textarea', {
    class: 'body-editor', spellcheck: 'false', 'aria-label': 'プロンプト本文', value: d.body,
    placeholder: 'プロンプト本文を入力します。\n入力欄にしたい箇所は {{変数名}} と書きます。\n例）- 日付: {{日付}}',
    oninput: e => {
      d.body = e.target.value;
      markDirty();
      const before = varSignature(d);
      syncVariables(d);
      renderWarnings();
      if (varSignature(d) !== before) renderVarPanel();
    },
  });

  const left = h('section', { class: 'panel' },
    h('h2', { text: '本文' }),
    h('p', { class: 'editor-help' },
      '入力欄にしたい箇所は ', h('code', { text: '{{変数名}}' }), ' と書きます。変数名には日本語・英数字・', h('code', { text: '_' }),
      ' が使えます。文字として ', h('code', { text: '{{' }), ' を出したいときは ', h('code', { text: '\\{{' }), ' と書きます。'),
    bodyInput,
    h('div', { id: 'bodyWarnings' }));

  const right = h('section', { class: 'panel' },
    h('h2', { text: '入力欄の設定' }),
    h('div', { class: 'var-panel-scroll', id: 'varPanel' }));

  root.append(bar, h('div', { class: 'edit-grid' }, left, right));
  syncVariables(d);
  renderWarnings();
  renderVarPanel();
}

function renderWarnings() {
  const box = $('#bodyWarnings');
  if (!box) return;
  const { invalid } = parseBody(state.draft.body);
  box.replaceChildren();
  if (!invalid.length) return;
  box.append(h('div', { class: 'warn-box', role: 'status' },
    '次の記述は変数名のルールに合わないため、変数として扱わず、そのまま出力します（記号やスペースは使えません）。',
    h('ul', {}, invalid.slice(0, 10).map(s => h('li', {}, h('code', { text: s })))),
    invalid.length > 10 ? `ほか${invalid.length - 10}件` : null));
}

function renderVarPanel() {
  const d = state.draft;
  const p = $('#varPanel');
  if (!p) return;
  const scroll = p.scrollTop;
  p.replaceChildren();
  const used = d.variables.filter(v => !v.unused).sort(byOrder);
  const unused = d.variables.filter(v => v.unused).sort(byOrder);
  if (!used.length && !unused.length) {
    p.append(h('p', { class: 'muted small', text: '本文に {{変数名}} を書くと、ここに入力欄の設定が自動で追加されます。' }));
  }
  used.forEach((v, i) => p.append(varCard(v, { index: i, list: used })));
  if (unused.length) {
    p.append(
      h('h3', { class: 'sub', text: '未使用の変数' }),
      h('p', { class: 'muted small', text: '本文から消えた変数です。設定は残しています。本文に戻すと再び使われます。不要なら削除してください。' }));
    unused.forEach(v => p.append(varCard(v, { unused: true })));
  }
  p.scrollTop = scroll;
}

function moveVar(list, index, dir) {
  const j = index + dir;
  if (j < 0 || j >= list.length) return;
  list.forEach((v, k) => { v.order = k + 1; });
  [list[index].order, list[j].order] = [list[j].order, list[index].order];
  markDirty();
  renderVarPanel();
}

function changeType(v, type) {
  v.type = type;
  v.default = type === 'checkbox' ? false : '';
  if (type === 'checkbox') v.required = false;
  const o = v.options || {};
  if (type === 'date' && !o.format) o.format = DEFAULT_DATE_FORMAT;
  if (type === 'select' && !Array.isArray(o.choices)) o.choices = [];
  v.options = o;
  markDirty();
  renderVarPanel();
}

async function renameVar(v) {
  const d = state.draft;
  const next = await promptDialog('変数名を変更', `{{${v.name}}} の新しい名前（本文中の箇所もまとめて変わります）`, v.name, val => {
    if (!NAME_RE.test(val)) return '日本語・英数字・_ だけで入力してください';
    if (val !== v.name && d.variables.some(x => x.name === val)) return '同じ名前の変数がすでにあります';
    return '';
  }, '変更');
  if (next == null || next === v.name) return;
  const re = new RegExp(String.raw`(?<!\\)\{\{` + escRe(v.name) + String.raw`\}\}`, 'gu');
  d.body = d.body.replace(re, `{{${next}}}`);
  const orig = Object.keys(d._renames).find(k => d._renames[k] === v.name) || v.name;
  d._renames[orig] = next;
  v.name = next;
  v._auto = false;
  markDirty();
  $('.body-editor').value = d.body;
  syncVariables(d);
  renderWarnings();
  renderVarPanel();
}

function vfield(label, control, wide = false) {
  return h('label', { class: 'vfield' + (wide ? ' wide' : '') }, h('span', { class: 'vlabel', text: label }), control);
}
function vgroup(label, control, wide = false) {
  return h('div', { class: 'vfield' + (wide ? ' wide' : '') }, h('span', { class: 'vlabel', text: label }), control);
}

function defaultEditor(v) {
  const set = val => { v.default = val; markDirty(); };
  switch (v.type) {
    case 'textarea':
      return vfield('初期値', h('textarea', { rows: 2, value: str(v.default), oninput: e => set(e.target.value) }), true);
    case 'number':
      return vfield('初期値', h('input', { type: 'number', step: 'any', value: str(v.default), oninput: e => set(e.target.value) }));
    case 'checkbox':
      return vfield('初期値', h('select', { value: v.default ? 'true' : 'false', onchange: e => set(e.target.value === 'true') },
        h('option', { value: 'false', text: 'OFF' }), h('option', { value: 'true', text: 'ON' })));
    case 'select': {
      const choices = Array.isArray(v.options.choices) ? v.options.choices : [];
      return vfield('初期値', h('select', { value: str(v.default), onchange: e => set(e.target.value) },
        h('option', { value: '', text: 'なし' }), choices.map(c => h('option', { value: c, text: c }))));
    }
    case 'date': {
      const d = str(v.default);
      const mode = d === 'today' || d === 'yesterday' ? d : (/^\d{4}-\d{2}-\d{2}$/.test(d) ? 'fixed' : '');
      const sel = h('select', {
        value: mode,
        onchange: e => {
          const m = e.target.value;
          set(m === 'fixed' ? isoDate(0) : m);
          renderVarPanel();
        },
      },
        h('option', { value: '', text: 'なし' }),
        h('option', { value: 'today', text: '今日' }),
        h('option', { value: 'yesterday', text: '昨日' }),
        h('option', { value: 'fixed', text: '日付を指定' }));
      const fixed = mode === 'fixed'
        ? h('input', { type: 'date', value: d, onchange: e => set(e.target.value) })
        : null;
      return vgroup('初期値', h('div', { class: 'date-row' }, sel, fixed));
    }
    default:
      return vfield('初期値', h('input', { type: 'text', value: str(v.default), oninput: e => set(e.target.value) }));
  }
}

function typeOptionsEditor(v) {
  const setOpt = (k, val) => { v.options = { ...v.options, [k]: val }; markDirty(); };
  const o = v.options || {};
  switch (v.type) {
    case 'date': {
      const example = h('span', { class: 'format-example', text: `例：${formatDate(isoDate(0), o.format)}` });
      return [
        vfield('出力形式', h('input', {
          type: 'text', value: str(o.format || DEFAULT_DATE_FORMAT),
          oninput: e => {
            setOpt('format', e.target.value);
            example.textContent = `例：${formatDate(isoDate(0), e.target.value)}`;
          },
        })),
        vgroup('', example),
        h('div', { class: 'vfield wide token-list' },
          '使える記号：', h('code', { text: 'YYYY' }), ' 年　', h('code', { text: 'MM' }), ' 月（2桁）　', h('code', { text: 'M' }),
          ' 月　', h('code', { text: 'DD' }), ' 日（2桁）　', h('code', { text: 'D' }), ' 日　', h('code', { text: 'ddd' }), ' 曜日'),
      ];
    }
    case 'select':
      return [vfield('候補（1行に1つ）', h('textarea', {
        rows: 3, value: (Array.isArray(o.choices) ? o.choices : []).join('\n'),
        oninput: e => setOpt('choices', e.target.value.split('\n').map(s => s.trim()).filter(Boolean)),
        onchange: () => renderVarPanel(),
      }), true)];
    case 'number':
      return [
        vfield('最小値', h('input', { type: 'number', step: 'any', value: str(o.min), oninput: e => setOpt('min', e.target.value) })),
        vfield('最大値', h('input', { type: 'number', step: 'any', value: str(o.max), oninput: e => setOpt('max', e.target.value) })),
      ];
    case 'checkbox':
      return [
        vfield('ONのときに入る文', h('textarea', { rows: 2, value: str(o.onText), oninput: e => setOpt('onText', e.target.value) }), true),
        vfield('OFFのときに入る文（空欄可）', h('textarea', { rows: 2, value: str(o.offText), oninput: e => setOpt('offText', e.target.value) }), true),
      ];
    default:
      return [];
  }
}

function varCard(v, ctx) {
  const d = state.draft;
  const set = (k, val) => { v[k] = val; markDirty(); };

  const actions = ctx.unused
    ? [h('button', {
      type: 'button', class: 'small danger-ghost',
      onclick: () => { d.variables = d.variables.filter(x => x !== v); markDirty(); renderVarPanel(); },
    }, '削除')]
    : [
      h('button', { type: 'button', class: 'small ghost', 'aria-label': '上へ移動', disabled: ctx.index === 0, onclick: () => moveVar(ctx.list, ctx.index, -1) }, '↑'),
      h('button', { type: 'button', class: 'small ghost', 'aria-label': '下へ移動', disabled: ctx.index === ctx.list.length - 1, onclick: () => moveVar(ctx.list, ctx.index, 1) }, '↓'),
      h('button', { type: 'button', class: 'small ghost', onclick: () => renameVar(v) }, '名前変更'),
    ];

  const head = h('div', { class: 'var-head' },
    h('code', { class: 'var-name', text: `{{${v.name}}}` }),
    ctx.unused ? h('span', { class: 'badge badge-muted', text: '未使用' }) : null,
    v.label && !ctx.unused ? h('span', { class: 'muted small', text: v.label }) : null,
    h('div', { class: 'var-head-actions' }, actions));

  if (ctx.unused) return h('div', { class: 'var-card unused' }, head);

  const fields = [
    vfield('表示名', h('input', { type: 'text', value: v.label, placeholder: v.name, oninput: e => set('label', e.target.value) })),
    vfield('型', h('select', { value: v.type, onchange: e => changeType(v, e.target.value) },
      TYPES.map(([val, lab]) => h('option', { value: val, text: lab })))),
    defaultEditor(v),
  ];
  if (v.type === 'text' || v.type === 'textarea' || v.type === 'number') {
    fields.push(vfield('プレースホルダー', h('input', { type: 'text', value: v.placeholder, oninput: e => set('placeholder', e.target.value) })));
  }
  fields.push(vfield('説明文', h('input', { type: 'text', value: v.help, oninput: e => set('help', e.target.value) }), v.type !== 'text' && v.type !== 'textarea' && v.type !== 'number'));
  fields.push(...typeOptionsEditor(v));

  const flags = h('div', { class: 'vflags' },
    v.type !== 'checkbox'
      ? h('label', {}, h('input', { type: 'checkbox', checked: v.required, onchange: e => set('required', e.target.checked) }), '必須')
      : null,
    h('label', {}, h('input', { type: 'checkbox', checked: v.keepLast, onchange: e => set('keepLast', e.target.checked) }), '前回の値を引き継ぐ'));

  return h('div', { class: 'var-card' }, head, h('div', { class: 'var-grid' }, fields), flags);
}

function finalizeDraft(d) {
  const t = clone(d);
  delete t._renames;
  syncVariables(t);
  t.variables.forEach(v => delete v._auto);
  t.variables.filter(v => !v.unused).sort(byOrder).forEach((v, i) => { v.order = i + 1; });
  return t;
}

function saveDraft() {
  const d = state.draft;
  if (!d.name.trim()) {
    toast('テンプレート名を入力してください', 'error');
    $('.title-input').focus();
    return;
  }
  const now = new Date().toISOString();
  const t = finalizeDraft(d);
  t.name = t.name.trim();
  t.updatedAt = now;
  if (!t.id) {
    t.id = uuid();
    t.createdAt = now;
    state.templates.push(t);
  } else {
    const i = state.templates.findIndex(x => x.id === t.id);
    if (i >= 0) state.templates[i] = t; else state.templates.push(t);
  }

  const renameKeys = (obj) => {
    if (!obj) return;
    for (const [from, to] of Object.entries(d._renames)) {
      if (from !== to && hasOwn(obj, from)) { obj[to] = obj[from]; delete obj[from]; }
    }
  };
  renameKeys(state.lastValues[t.id]);
  const keepValues = state.currentId === t.id ? { ...state.values } : null;
  renameKeys(keepValues);

  if (!saveTemplates()) return;
  saveLastValues();
  state.draftDirty = false;
  state.draft = null;
  showScreen('use');
  openTemplate(t.id, keepValues || undefined);
  toast('保存しました');
}

async function cancelEdit() {
  if (state.draftDirty) {
    const ok = await confirmDialog('保存していない変更は破棄されます。編集を終了しますか？', { ok: '破棄して戻る', danger: true });
    if (!ok) return;
  }
  state.draftDirty = false;
  state.draft = null;
  showScreen('use');
  renderUse();
}

async function deleteFromEditor() {
  const id = state.draft && state.draft.id;
  if (!id) return;
  if (await deleteTemplate(id)) {
    state.draftDirty = false;
    state.draft = null;
    showScreen('use');
    renderUse();
  }
}

/* =========================================================
 * サンプル（要件定義書 7章）
 * ======================================================= */
const SAMPLE_BODY = `# 固定部分

あなたは、指定Xアカウントの指定日投稿を一次情報として読み、見返し用の日記を作る。推測で生活や感情を埋めない。投稿にない事実は書かない。

## 取得

- 対象は指定アカウントの指定日（JST 0:00–23:59）。Xの時刻はGMTなので、前日15:00 GMT以降を当日分に含める。取得時点が当日中なら、その時刻までと明記する。
- 本文、自リプ、引用、画像、動画、リンク先のタイトルが判定に必要ならそこまで見る。いいね数・再生数は取得時点の値で、増減しうると書く。
- アカウントの表示名・bio・関連アカウントは、日記の口調やログ用途の判断にだけ使う。

## 分析

- 時系列で束ねる。テーマが同じなら深夜／昼／夜のようにまとめてよい。
- 残すのは、後から検索できる固有名詞（曲名、イベント名、作品名、人物、ハッシュタグ）と、投稿者自身の判定（「イメージ通り」「リスト入り」「まだ結論を書いていない」など）。
- 生活記述がない日は「外出ではない」と書く。名前が本文にないものは特定しない。
- 数値・事実には取得日と出典を併記する。検索結果の取得日が当日とずれていれば、古い可能性を明記する。

## 日記

- 1日{{日記の長さ}}。見返しを優先し、気分だけの文は書かない。
- 一人称は投稿者。各行に「いつ・何を・どう判定したか」を入れる。
- 未記載の名前、行っていない行動、投稿にない結論は書かない。
- 出力順は「読み取れた流れ」のあと「日記」。日記本文に引用カードは入れない。

# 可変部分

- アカウント: {{アカウント}}
- 日付: {{日付}}（JST）
- 日記の長さ: {{日記の長さ}}
- 優先: {{優先}}
- 追加ルール: {{追加ルール}}
- 出力: {{出力}}
`;

function sampleTemplate() {
  const now = new Date().toISOString();
  const v = (name, o) => Object.assign(newVar(name, 0), o);
  return normalizeTemplate({
    id: uuid(),
    name: 'X日記',
    body: SAMPLE_BODY,
    createdAt: now,
    updatedAt: now,
    variables: [
      v('アカウント', { order: 1, label: 'Xアカウント', required: true, placeholder: '@なしで入力', keepLast: true }),
      v('日付', { order: 2, type: 'date', required: true, default: 'yesterday', options: { format: DEFAULT_DATE_FORMAT } }),
      v('日記の長さ', { order: 3, type: 'select', required: true, default: '1〜5行', options: { choices: ['1〜3行', '1〜5行'] } }),
      v('優先', { order: 4, type: 'textarea', default: 'あとで見返せること（曲名・イベント名・手元の物と画面の対応・自分の判定）' }),
      v('追加ルール', { order: 5, type: 'textarea', default: '数値と事実には取得日と出典を併記し、古い可能性があれば明記する' }),
      v('出力', {
        order: 6, type: 'select', required: true, default: '分析（時系列の束ね）＋見返し用日記',
        options: { choices: ['分析（時系列の束ね）＋見返し用日記', '分析（時系列の束ね）のみ'] },
      }),
    ],
  }, true);
}

function addSample() {
  const t = sampleTemplate();
  addTemplates([t]);
  openTemplate(t.id);
  refreshDrawer();
  toast(`「${t.name}」を追加しました`);
}

/* =========================================================
 * イベント
 * ======================================================= */
function bindEvents() {
  $('#templateSelect').addEventListener('change', e => switchTemplate(e.target.value));
  $('#btnList').addEventListener('click', () => openDrawer('テンプレート一覧', renderListDrawer));
  $('#btnHistory').addEventListener('click', () => openDrawer('コピー履歴', renderHistoryDrawer));
  $('#btnSettings').addEventListener('click', () => openDrawer('設定', renderSettingsDrawer));
  $('#btnEdit').addEventListener('click', () => { if (current()) openEditor(state.currentId); });
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#overlay').addEventListener('click', closeDrawer);

  $('#emptyNew').addEventListener('click', () => openEditor(null));
  $('#emptySample').addEventListener('click', addSample);
  $('#emptyImport').addEventListener('click', importFromFile);

  for (const b of document.querySelectorAll('#mobileTabs [data-tab]')) {
    b.addEventListener('click', () => { state.mobileTab = b.dataset.tab; applyMobileTab(); });
  }

  $('#form').addEventListener('submit', e => e.preventDefault());
  $('#btnCopy').addEventListener('click', doCopy);
  $('#btnReset').addEventListener('click', resetLock);

  const preview = $('#preview');
  preview.setAttribute('contenteditable', 'plaintext-only');
  const plainOnly = preview.contentEditable === 'plaintext-only';
  if (!plainOnly) {
    preview.setAttribute('contenteditable', 'true');
    preview.addEventListener('paste', e => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    });
  }
  preview.addEventListener('input', () => {
    state.locked = true;
    state.lockedText = preview.innerText;
    updateMeta();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawerOpen() && !$('#modal').open) {
      closeDrawer();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && state.screen === 'use' && !$('#modal').open && !drawerOpen()) {
      e.preventDefault();
      doCopy();
    }
  });

  window.addEventListener('beforeunload', e => {
    if (state.screen === 'edit' && state.draftDirty) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  window.addEventListener('storage', e => {
    // 別タブでの変更を取り込む（編集中は上書きしない）
    if (!Object.values(KEYS).includes(e.key) || state.screen === 'edit') return;
    const keepId = state.currentId;
    const keepValues = { ...state.values };
    const wasLocked = state.locked;
    loadState();
    if (keepId && state.templates.some(t => t.id === keepId) && !wasLocked) {
      openTemplate(keepId, keepValues);
    } else if (!wasLocked) {
      state.currentId = null;
      renderUse();
    }
    refreshDrawer();
  });
}

/* =========================================================
 * 起動（4.3）
 * ======================================================= */
function init() {
  loadState();
  applyTheme();
  bindEvents();
  const lastId = state.settings.lastTemplateId;
  const id = state.templates.some(t => t.id === lastId)
    ? lastId
    : (sortedTemplates()[0] ? sortedTemplates()[0].id : null);
  if (id) openTemplate(id); else renderUse();
}

// テスト用に純粋関数を公開
window.PromptForm = { parseBody, formatDate, generate, syncVariables, normalizeTemplate, segsToText, initialValue, sampleTemplate };

init();
})();
